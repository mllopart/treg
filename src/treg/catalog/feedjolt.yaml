provider: feedjolt
source:
  docs: https://www.feedjolt.com/en/docs/developers
  openapi: https://api.feedjolt.com/openapi.json
  curated: 2026-09-02
# BYOK listing. REST+MCP sit in Feedjolt's premium set (Startup $9/mo monthly, Scale $15/mo
# annual). There is no per-call meter and no rate-card endpoint, so treg cannot serve these on
# its own key yet. Authenticated routes are own_account workspace data.
#
# MCP (Streamable HTTP at /mcp/reader and /mcp/writer) is a sibling product, not catalogued here —
# treg relays REST HTTP, not JSON-RPC.
#
# Probe is GET /workspaces. GET /health is unauthenticated (200 with no key) and must not be used.

limits: "plan-included; 429 on abuse. REST API is not on the Growth plan."
pricing_url: https://www.feedjolt.com/en

proposed_capabilities:
  product.feedback.boards.list: "List feedback boards in a product workspace"
  product.feedback.posts.list: "List customer feedback posts"
  product.feedback.posts.get: "Get one feedback post"
  product.feedback.posts.search: "Search customer feedback posts by keyword"
  product.feedback.roadmap.get: "Get a product roadmap grouped by status"
  product.feedback.changelog.list: "List published changelog entries"
  product.feedback.statuses.list: "List feedback statuses in a workspace"
  product.feedback.tags.list: "List tags in a feedback workspace"

endpoints:
  - id: feedjolt.public.boards.list
    capability: product.feedback.boards.list
    platform: web
    scope: any_account
    method: GET
    path: /public/{workspace_slug}/boards
    name: "List public boards"
    summary: "List Public Boards"
    input:
      pathParams:
        workspace_slug: {type: string, required: true, note: "workspace slug", example: "corvidly"}
    test_request:
      pathParams: {workspace_slug: "corvidly"}
    cost:
      type: free
      value: 0
      currency: USD
      unit: call
      source: docs
      source_url: https://www.feedjolt.com/en
      checked: "2026-09-02"
      confidence: documented
      note: "Public portal read; no API key required. Included in plan when a key is used."
    docs_url: https://api.feedjolt.com/docs

  - id: feedjolt.public.posts.list
    capability: product.feedback.posts.list
    platform: web
    scope: any_account
    method: GET
    path: /public/{workspace_slug}/boards/{board_slug}/posts
    name: "List public posts on a board"
    summary: "List Public Posts"
    input:
      pathParams:
        workspace_slug: {type: string, required: true, example: "corvidly"}
        board_slug: {type: string, required: true, example: "feedback"}
      queryParams:
        page: {type: integer, required: false, example: 1}
        page_size: {type: integer, required: false, note: "price dial; keep small", example: 3}
        sort_by: {type: string, required: false, note: "default newest"}
        q: {type: string, required: false}
        status_id: {type: string, required: false}
        tag_ids: {type: string, required: false}
    test_request:
      pathParams: {workspace_slug: "corvidly", board_slug: "feedback"}
      queryParams: {page_size: 3}
    cost:
      type: free
      value: 0
      currency: USD
      unit: call
      source: docs
      source_url: https://www.feedjolt.com/en
      checked: "2026-09-02"
      confidence: documented
      note: "Public portal read; no API key required."
    docs_url: https://api.feedjolt.com/docs

  - id: feedjolt.public.posts.get
    capability: product.feedback.posts.get
    platform: web
    scope: any_account
    method: GET
    path: /public/{workspace_slug}/posts/{post_id}
    name: "Get a public post"
    summary: "Get Public Post"
    input:
      pathParams:
        workspace_slug: {type: string, required: true, example: "corvidly"}
        post_id: {type: string, required: true, example: "52428c9b-971a-4804-a96e-73ce3da4ab17"}
    test_request:
      pathParams: {workspace_slug: "corvidly", post_id: "52428c9b-971a-4804-a96e-73ce3da4ab17"}
    cost:
      type: free
      value: 0
      currency: USD
      unit: call
      source: docs
      source_url: https://www.feedjolt.com/en
      checked: "2026-09-02"
      confidence: documented
      note: "Public portal read; no API key required. Test id harvested from the board list on 2026-09-02."
    docs_url: https://api.feedjolt.com/docs

  - id: feedjolt.public.posts.search
