      checked: "2026-09-02"
      confidence: documented
      note: "Probe. Garbage key returns 401 {\"detail\":\"Not authenticated\"}. Valid-key 2xx pending maintainer credential."
    docs_url: https://www.feedjolt.com/en/docs/developers

