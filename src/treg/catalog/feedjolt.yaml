provider: feedjolt
source:
  docs: https://www.feedjolt.com/en/docs/developers
  openapi: https://api.feedjolt.com/openapi.json
  curated: 2026-09-02
# Public portal reads only. Workspace REST is session-cookie authenticated, so
# own_account tools and a key probe are omitted. MCP is not catalogued (JSON-RPC).

limits: "public portal reads; no API key required"
pricing_url: https://www.feedjolt.com/en

proposed_capabilities:
  product.feedback.boards.list: "List feedback boards in a product workspace"
  product.feedback.posts.list: "List customer feedback posts"
  product.feedback.posts.get: "Get one feedback post"
  product.feedback.posts.search: "Search customer feedback posts by keyword"
  product.feedback.roadmap.get: "Get a product roadmap grouped by status"
  product.feedback.changelog.list: "List published changelog entries"

endpoints:
  - id: feedjolt.public.boards.list
    capability: product.feedback.boards.list
    platform: web
    scope: any_account
    method: GET
    path: /public/{workspace_slug}/boards
    name: "List public boards"
    summary: "List Public Boards"
    input:
      pathParams:
        workspace_slug: {type: string, required: true, example: "corvidly"}
    test_request:
      pathParams: {workspace_slug: "corvidly"}
    cost:
      type: free
      value: 0
      currency: USD
      unit: call
      source: docs
      source_url: https://www.feedjolt.com/en
      checked: "2026-09-02"
      confidence: documented
      note: "Public portal read; no API key required."
    docs_url: https://api.feedjolt.com/docs

  - id: feedjolt.public.posts.list
    capability: product.feedback.posts.list
    platform: web
    scope: any_account
    method: GET
    path: /public/{workspace_slug}/boards/{board_slug}/posts
    name: "List public posts on a board"
    summary: "List Public Posts"
    input:
      pathParams:
        workspace_slug: {type: string, required: true, example: "corvidly"}
        board_slug: {type: string, required: true, example: "feedback"}
      queryParams:
        page: {type: integer, required: false, example: 1}
        page_size: {type: integer, required: false, example: 3}
        sort_by: {type: string, required: false}
        q: {type: string, required: false}
        status_id: {type: string, required: false}
        tag_ids: {type: string, required: false}
    test_request:
      pathParams: {workspace_slug: "corvidly", board_slug: "feedback"}
      queryParams: {page_size: 3}
    cost:
      type: free
      value: 0
      currency: USD
      unit: call
      source: docs
      source_url: https://www.feedjolt.com/en
      checked: "2026-09-02"
      confidence: documented
      note: "Public portal read; no API key required."
    docs_url: https://api.feedjolt.com/docs

  - id: feedjolt.public.posts.get
    capability: product.feedback.posts.get
    platform: web
    scope: any_account
    method: GET
    path: /public/{workspace_slug}/posts/{post_id}
    name: "Get a public post"
    summary: "Get Public Post"
    input:
      pathParams:
        workspace_slug: {type: string, required: true, example: "corvidly"}
        post_id: {type: string, required: true, example: "52428c9b-971a-4804-a96e-73ce3da4ab17"}
    test_request:
      pathParams: {workspace_slug: "corvidly", post_id: "52428c9b-971a-4804-a96e-73ce3da4ab17"}
    cost:
      type: free
      value: 0
      currency: USD
      unit: call
      source: docs
      source_url: https://www.feedjolt.com/en
      checked: "2026-09-02"
      confidence: documented
      note: "Public portal read; no API key required."
    docs_url: https://api.feedjolt.com/docs

  - id: feedjolt.public.posts.search
    capability: product.feedback.posts.search
    platform: web
    scope: any_account
    method: GET
    path: /public/{workspace_slug}/search
    name: "Search public posts"
    summary: "Search Public Posts"
    input:
      pathParams:
        workspace_slug: {type: string, required: true, example: "corvidly"}
      queryParams:
        q: {type: string, required: true, example: "MCP", note: "minLength 2, maxLength 200"}
    test_request:
      pathParams: {workspace_slug: "corvidly"}
      queryParams: {q: "MCP"}
    cost:
      type: free
      value: 0
      currency: USD
      unit: call
      source: docs
      source_url: https://www.feedjolt.com/en
      checked: "2026-09-02"
      confidence: documented
      note: "Public portal read. OpenAPI: q minLength 2, maxLength 200."
    docs_url: https://api.feedjolt.com/docs

  - id: feedjolt.public.roadmap.get
    capability: product.feedback.roadmap.get
    platform: web
    scope: any_account
    method: GET
    path: /public/{workspace_slug}/roadmap
    name: "Get public roadmap"
    summary: "Get Public Roadmap"
    input:
      pathParams:
        workspace_slug: {type: string, required: true, example: "corvidly"}
      queryParams:
        tags: {type: string, required: false, note: "comma-separated tag ids"}
    test_request:
      pathParams: {workspace_slug: "corvidly"}
    cost:
      type: free
      value: 0
      currency: USD
      unit: call
      source: docs
      source_url: https://www.feedjolt.com/en
      checked: "2026-09-02"
      confidence: documented
      note: "Public portal read."
    docs_url: https://api.feedjolt.com/docs

  - id: feedjolt.public.changelog.list
    capability: product.feedback.changelog.list
    platform: web
    scope: any_account
    method: GET
    path: /public/{workspace_slug}/changelog
    name: "List public changelog"
    summary: "List Public Changelog"
    input:
      pathParams:
        workspace_slug: {type: string, required: true, example: "corvidly"}
      queryParams:
        page: {type: integer, required: false, example: 1}
        page_size: {type: integer, required: false, example: 5}
        version_id: {type: string, required: false}
    test_request:
      pathParams: {workspace_slug: "corvidly"}
      queryParams: {page_size: 5}
    cost:
      type: free
      value: 0
      currency: USD
      unit: call
      source: docs
      source_url: https://www.feedjolt.com/en
      checked: "2026-09-02"
      confidence: documented
      note: "Public portal read."
    docs_url: https://api.feedjolt.com/docs
